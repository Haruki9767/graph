<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<canvas id="cv" aria-label="Water surface. Drag to make ripples."></canvas>
<div class="hint" id="hint">Drag anywhere to make waves</div>
<section class="panel" id="panel">
  <div class="hd"><b>Ripples</b><button id="tg" aria-expanded="true">Hide</button></div>
  <div class="body">
    <label class="row">Viscosity<input type="range" id="vi" min="0" max="100" value="12"></label>
    <label class="row">Wave strength<input type="range" id="st" min="5" max="100" value="50"></label>
    <div class="maps" id="maps" role="group" aria-label="Color map"></div>
    <div class="act"><button class="clr" id="clr">Clear surface</button><label><input type="checkbox" id="rain">Rain</label></div>
  </div>
</section>
<script src="index.js">
</script>
</body>
